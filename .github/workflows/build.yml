name: build

on:
  push:
    branches: [ unstable, '[0-9]+.[0-9]+.x' ]
  pull_request:
    branches: [ unstable, '[0-9]+.[0-9]+.x' ]
  workflow_call:
  workflow_dispatch:

env:
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_COMPILERCHECK: content
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 500M
  CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime
  CCACHE_COMPRESS: "1"
  CCACHE_COMPRESSLEVEL: "1"

jobs:
  build:

    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu builds with the versioned clang packages of matrix.llvm, macos with the unversioned clang of brew's llvm
          - {os: ubuntu-24.04, llvm: 20, doc: ON }
          - {os: ubuntu-24.04, llvm: 21, doc: OFF, apt_llvm_org: true }
          - {os: ubuntu-24.04, llvm: 22, doc: OFF, apt_llvm_org: true }
          - {os: ubuntu-24.04, llvm: 23, doc: OFF, apt_llvm_org: true }
          - {os: macos-14, cc: clang, cxx: clang++, doc: OFF }

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ matrix.os }}-${{ matrix.cc || matrix.llvm }}-${{ github.run_id }}
        restore-keys:
          ccache-${{ matrix.os }}-${{ matrix.cc || matrix.llvm }}-

    # LLVM releases newer than the one in the ubuntu repositories (currently 20) come from apt.llvm.org.
    # The versioned suite is used rather than llvm.sh, whose unversioned "development" suite moves on to
    # the next major version as soon as LLVM branches for release.
    - name: Add the apt.llvm.org repository
      if: ${{ matrix.apt_llvm_org }}
      run: |
        sudo apt-get update
        sudo apt-get install -y lsb-release wget software-properties-common gnupg
        wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc > /dev/null
        sudo add-apt-repository -y "deb https://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-${{ matrix.llvm }} main"

    - name: Install ubuntu dependencies
      if: ${{ contains(matrix.os, 'ubuntu') }}
      run: >
        sudo apt-get update &&
        sudo apt-get install lsb-release wget software-properties-common &&
        sudo apt-get install
        ccache
        clang-${{ matrix.llvm }}
        g++
        doxygen
        llvm-${{ matrix.llvm }}-dev
        libclang-${{ matrix.llvm }}-dev
        libomp-dev
        clang-format-${{ matrix.llvm }}
        libgmp-dev
        libhdf5-dev
        libopenblas-dev
        libopenmpi-dev
        openmpi-bin
        openmpi-common
        openmpi-doc
        python3-dev
        python3-mako
        python3-matplotlib
        python3-mpi4py
        python3-numpy
        python3-pip
        python3-scipy
        python3-ipython
        python3-numpydoc
        python3-sphinx
        python3-sphinx-rtd-theme
        python3-sphinx-copybutton
        python3-nbsphinx
        python3-myst-parser
        python3-linkify-it

    - name: Set up virtualenv
      run: |
        mkdir $HOME/.venv
        python3 -m venv --system-site-packages $HOME/.venv/my_python
        source $HOME/.venv/my_python/bin/activate
        echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> $GITHUB_ENV
        echo "PATH=$PATH" >> $GITHUB_ENV

    - name: Install homebrew dependencies
      if: ${{ contains(matrix.os, 'macos') }}
      run: |
        brew update
        brew install ccache gcc llvm hdf5 open-mpi openblas doxygen
        pip install mako numpy scipy mpi4py
        pip install -r requirements.txt
        echo "PATH=$(brew --prefix llvm)/bin:$(brew --prefix gcc)/bin:$PATH" >> $GITHUB_ENV
        echo "PYTHONPATH=$(brew --prefix llvm)/lib/python3.13/site-packages" >> $GITHUB_ENV

    - name: Build clair
      env:
        CC: ${{ matrix.cc || format('clang-{0}', matrix.llvm) }}
        CXX: ${{ matrix.cxx || format('clang++-{0}', matrix.llvm) }}
      run: |
        cmake -B build -S. -DCMAKE_INSTALL_PREFIX=$HOME/install -DBuild_Documentation=${{ matrix.doc }}
        cd build && make -j2 || make -j1 VERBOSE=1

    - name: Test clair
      run: |
        cd build
        ctest -j2 --output-on-failure

    - name: ccache statistics
      if: always()
      run: ccache -sv

    - uses: actions/cache/save@v4
      if: always()
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ matrix.os }}-${{ matrix.cc || matrix.llvm }}-${{ github.run_id }}

    - name: Deploy unstable documentation to website
      if: matrix.doc == 'ON' && github.ref == 'refs/heads/unstable'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: build/doc/html
        branch: github.io
        target-folder: docs/unstable

    - name: Deploy release documentation to website
      if: matrix.doc == 'ON' && startsWith(github.ref, 'refs/heads/') && endsWith(github.ref, '.x')
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: build/doc/html
        branch: github.io
        target-folder: docs/${{ github.ref_name }}
